spring.mvc.view.prefix = /WEB-INF/views/
spring.mvc.view.suffix = .jsp
spring.mvc.static-path-pattern=/resources/**
server.servlet.contextPath=/zuniversity

# Force Jersey to act as a Servlet, not a Filter
spring.jersey.type=servlet

# Tell Spring where Jersey's entry point is (matches your UnivAppConfig)
spring.jersey.application-path=/webservices

